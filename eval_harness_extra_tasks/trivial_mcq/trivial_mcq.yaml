task: trivial_mcq
dataset_path: arbml/ArabicMMLU
output_type: multiple_choice
test_split: test
doc_to_text: "Question: {{Question}}.
Choices: A.{{A}} B.{{B}} C.{{C}} D.{{D}} E.{{E}}.
Answer:"
doc_to_target: answer
doc_to_choice: ['A', 'B', 'C', 'D', 'E']
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: True
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0